version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: shophub-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    container_name: shophub-auth
    env_file: ./services/auth-service/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/auth_db
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4001
    ports:
      - "4001:4001"
    depends_on:
      mongodb:
        condition: service_healthy

  product-service:
    build: ./services/product-service
    container_name: shophub-product
    env_file: ./services/product-service/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/product_db
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4002
    ports:
      - "4002:4002"
    depends_on:
      mongodb:
        condition: service_healthy

  cart-service:
    build: ./services/cart-service
    container_name: shophub-cart
    env_file: ./services/cart-service/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/cart_db
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4003
      - PRODUCT_SERVICE_URL=http://product-service:4002
    ports:
      - "4003:4003"
    depends_on:
      mongodb:
        condition: service_healthy
      product-service:
        condition: service_started

  order-service:
    build: ./services/order-service
    container_name: shophub-order
    env_file: ./services/order-service/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/order_db
      - JWT_SECRET=${JWT_SECRET}
      - PORT=4004
      - CART_SERVICE_URL=http://cart-service:4003
      - PRODUCT_SERVICE_URL=http://product-service:4002
    ports:
      - "4004:4004"
    depends_on:
      mongodb:
        condition: service_healthy
      cart-service:
        condition: service_started
      product-service:
        condition: service_started

  gateway:
    build: ./services/gateway
    container_name: shophub-gateway
    env_file: ./services/gateway/.env
    environment:
      - PORT=4000
      - AUTH_SERVICE_URL=http://auth-service:4001
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - CART_SERVICE_URL=http://cart-service:4003
      - ORDER_SERVICE_URL=http://order-service:4004
    ports:
      - "4000:4000"
    depends_on:
      - auth-service
      - product-service
      - cart-service
      - order-service

  frontend:
    build: ./frontend
    container_name: shophub-frontend
    environment:
      - VITE_API_URL=http://localhost:4000
    ports:
      - "5173:80"
    depends_on:
      - gateway

volumes:
  mongo-data: