
services:
  mongodb:
    image: mongo:7
    container_name: shophub-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongo-init:
    image: mongo:7
    container_name: shophub-mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      mongosh --host mongodb:27017 --eval
      'try { rs.status().ok } catch(e) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }] }) }'
    restart: on-failure

  redis:
    image: redis:7-alpine
    container_name: shophub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-service:
    build: ./services/auth-service
    container_name: shophub-auth

    environment:
      - MONGO_URI=mongodb://mongodb:27017/auth_db?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev_internal_key_change_me_0123456789}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:5173}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@shophub.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin12345}
      - PORT=4001
      - REDIS_URL=redis://redis:6379
    ports:
      - "4001:4001"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4001/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  product-service:
    build: ./services/product-service
    container_name: shophub-product

    environment:
      - MONGO_URI=mongodb://mongodb:27017/product_db?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev_internal_key_change_me_0123456789}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:5173}
      - PORT=4002
      - REDIS_URL=redis://redis:6379
    ports:
      - "4002:4002"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4002/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  cart-service:
    build: ./services/cart-service
    container_name: shophub-cart

    environment:
      - MONGO_URI=mongodb://mongodb:27017/cart_db?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev_internal_key_change_me_0123456789}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:5173}
      - PORT=4003
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - REDIS_URL=redis://redis:6379
    ports:
      - "4003:4003"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      product-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4003/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  order-service:
    build: ./services/order-service
    container_name: shophub-order

    environment:
      - MONGO_URI=mongodb://mongodb:27017/order_db?replicaSet=rs0
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev_internal_key_change_me_0123456789}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:5173}
      - PORT=4004
      - CART_SERVICE_URL=http://cart-service:4003
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - REDIS_URL=redis://redis:6379
    ports:
      - "4004:4004"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      cart-service:
        condition: service_started
      product-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4004/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  gateway:
    build: ./services/gateway
    container_name: shophub-gateway

    environment:
      - PORT=4000
      - AUTH_SERVICE_URL=http://auth-service:4001
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - CART_SERVICE_URL=http://cart-service:4003
      - ORDER_SERVICE_URL=http://order-service:4004
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-dev_internal_key_change_me_0123456789}
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:5173}
      - REDIS_URL=redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      cart-service:
        condition: service_started
      order-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    container_name: shophub-frontend
    ports:
      - "5173:80"
    depends_on:
      gateway:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo-data:
