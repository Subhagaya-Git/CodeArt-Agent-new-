# =============================================================================
# ShopHub — opt-in Docker secrets overlay
# =============================================================================
# Mounts secrets as files under /run/secrets and points each service at the
# corresponding *_FILE variable. readSecret() prefers the *_FILE value over the
# plain env var, so this overlay transparently overrides docker-compose.yml.
#
# Usage:
#   mkdir -p secrets
#   node -e "require('fs').writeFileSync('secrets/jwt_secret.txt', require('crypto').randomBytes(48).toString('hex'))"
#   node -e "require('fs').writeFileSync('secrets/internal_api_key.txt', require('crypto').randomBytes(24).toString('hex'))"
#   node -e "require('fs').writeFileSync('secrets/admin_password.txt', 'ChangeMe_Strong_Passw0rd')"
#   docker compose -f docker-compose.yml -f docker-compose.secrets.yml up --build
#
# Secret files live in ./secrets/ and are gitignored — never commit them.
# =============================================================================

services:
  auth-service:
    environment:
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - INTERNAL_API_KEY_FILE=/run/secrets/internal_api_key
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
    secrets:
      - jwt_secret
      - internal_api_key
      - admin_password

  product-service:
    environment:
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - INTERNAL_API_KEY_FILE=/run/secrets/internal_api_key
    secrets:
      - jwt_secret
      - internal_api_key

  cart-service:
    environment:
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - INTERNAL_API_KEY_FILE=/run/secrets/internal_api_key
    secrets:
      - jwt_secret
      - internal_api_key

  order-service:
    environment:
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
      - INTERNAL_API_KEY_FILE=/run/secrets/internal_api_key
    secrets:
      - jwt_secret
      - internal_api_key

  gateway:
    environment:
      - INTERNAL_API_KEY_FILE=/run/secrets/internal_api_key
    secrets:
      - internal_api_key

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  internal_api_key:
    file: ./secrets/internal_api_key.txt
  admin_password:
    file: ./secrets/admin_password.txt